name: Sync upstream apps

# Pulls the latest commits from each original repository into apps/ and pushes to main.
# The monorepo is a read-only mirror: changes to apps/ belong in the original repos.
on:
  schedule:
    # TEMPORARY for testing. Switch to '0 18 * * *' (daily, 2 AM Philippine time) once verified.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # subtree pull needs full history to find the previous import

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: Pull upstream changes
        run: scripts/sync.sh

      - name: Push to main
        run: git push origin HEAD:main

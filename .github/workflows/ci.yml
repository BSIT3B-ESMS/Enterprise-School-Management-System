name: CI

# Runs each app's checks only when that app changed, then reports one result in "ci-ok".
# "ci-ok" is the status check to require on main: it always runs, so a PR that skips an app's checks never waits.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      ems: ${{ steps.filter.outputs.ems }}
      admission: ${{ steps.filter.outputs.admission }}
      dms: ${{ steps.filter.outputs.dms }}
      es: ${{ steps.filter.outputs.es }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A change to the root workflows reruns every app's checks.
          filters: |
            ems:
              - 'apps/ems/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ems-ci.yml'
            admission:
              - 'apps/admission/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/admission-tests.yml'
            dms:
              - 'apps/document-management/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/dms-ci.yml'
            es:
              - 'apps/enrollment/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/es-ci.yml'
            workflows:
              - '.github/workflows/**'

  ems:
    name: EMS
    needs: changes
    if: needs.changes.outputs.ems == 'true'
    uses: ./.github/workflows/ems-ci.yml

  admission:
    name: Admission
    needs: changes
    if: needs.changes.outputs.admission == 'true'
    uses: ./.github/workflows/admission-tests.yml

  dms:
    name: Document Management
    needs: changes
    if: needs.changes.outputs.dms == 'true'
    uses: ./.github/workflows/dms-ci.yml

  es:
    name: Enrollment
    needs: changes
    if: needs.changes.outputs.es == 'true'
    uses: ./.github/workflows/es-ci.yml

  actionlint:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ShellCheck is off for now: the app workflows' shell steps were written before this check existed.
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color -shellcheck= -pyflakes=

  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check <app>/<description> naming
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(ems|oas|dms|pms|es|repo)/[a-z0-9][a-z0-9._-]*$ || "$BRANCH" == dependabot/* ]]; then
            echo "Branch name OK: $BRANCH"
            exit 0
          fi
          echo "::error::Branch '$BRANCH' must be named <app>/<description> in lowercase, where <app> is one of: ems, oas, dms, pms, es, repo. Example: ems/leave-approvals"
          exit 1

  ci-ok:
    name: ci-ok
    needs: [changes, ems, admission, dms, es, actionlint, branch-name]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any app check failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done

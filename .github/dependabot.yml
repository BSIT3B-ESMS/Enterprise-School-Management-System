version: 2
updates:
  - package-ecosystem: composer
    directories:
      - /apps/ems
      - /apps/admission
      - /apps/document-management
      - /apps/enrollment
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories:
      - /apps/ems
      - /apps/document-management
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
